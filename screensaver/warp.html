<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;cursor:none}canvas{display:block;width:100%;height:100%}#error{position:fixed;inset:20px;color:#ffb5a6;white-space:pre-wrap;font:16px monospace;cursor:auto}</style>

<script>
'use strict';
// All assets are generated here. Time is reduced to one 12-second phase,

const canvas=document.getElementById('c'), params=new URLSearchParams(location.search);

const TAU=Math.PI*2;

const meshVS=`#version 300 es
precision highp float;
layout(location=0) in vec3 position;layout(location=1) in vec3 normal;layout(location=2) in float material;

const meshFS=`#version 300 es

}

const shipProgram=program(meshVS,meshFS);
let vertices=[];
function tri(a,b,c,m){let u=b.map((v,i)=>v-a[i]),v=c.map((v,i)=>v-a[i]);let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];let l=Math.hypot(...n)||1;n=n.map(x=>x/l);for(const p of [a,b,c])vertices.push(...p,...n,m)}

// Galaxy saucer: shallow convex decks, a substantial rim, and elliptical planform.
const profile=[[0,.91],[.13,.91],[.21,.80],[.40,.76],[.65,.70],[.84,.64],[.96,.60],[1,.55],[1,.46],[.96,.41],[.82,.29],[.60,.22],[.35,.20],[0,.23]];

// Secondary hull and its long aft taper.
surface(80,48,(u,v)=>{let z=-2.1+5.05*v;let w=.70*Math.pow(Math.sin(Math.PI*v),.65)*(1-.42*v);let a=TAU*u;return [w*Math.cos(a),-.53+w*.75*Math.sin(a),z]},0);

for(const s of [-1,1]){
beam([s*.30,-.28,.45],[s*1.95,.20,1.78],.36,.14,0);
// Long flattened warp nacelles, rounded forward shoulders and tapered stern caps.
surface(64,56,(u,v)=>{let z=-.66+4.42*v;let cap=Math.min(1,Math.sqrt(Math.max(0,1-Math.pow((v-.5)*2,8))));let w=.255*cap*(1-.26*v),h=.19*cap;let a=u*TAU;return [s*1.95+w*Math.cos(a),.34+h*Math.sin(a),z]},2);
// Blue field grilles on both sides, tucked inside raised metallic rails.
for(const side of [-1,1])surface(2,80,(u,v)=>[s*1.95+side*(.237-.055*v),.31+u*.14,-.27+3.48*v],3);
surface(12,80,(u,v)=>[s*1.95+(u-.5)*.23,.527-.017*v,-.20+3.35*v],3);
beam([s*1.95-.14,.535,-.21],[s*1.95-.12,.519,3.20],.035,.026,2);
beam([s*1.95+.14,.535,-.21],[s*1.95+.12,.519,3.20],.035,.026,2);
ellipsoid([s*1.95,.35,-.57],[.225,.16,.25],4,48,18);
ellipsoid([s*1.95,.355,3.58],[.16,.10,.25],5);
// Aft saucer impulse blocks, with inboard dark housings.
beam([s*.74,.58,-.02],[s*1.11,.58,-.02],.22,.13,5);
beam([s*.76,.585,.103],[s*1.09,.585,.103],.02,.071,4);
}
ellipsoid([0,-.53,-2.08],[.34,.22,.045],6);
beam([-.16,.36,.77],[.16,.36,.77],.12,.07,4);
const shipVAO=gl.createVertexArray();gl.bindVertexArray(shipVAO);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);for(let i=0;i<3;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,i===2?1:3,gl.FLOAT,false,28,i===0?0:i===1?12:24)}const shipCount=vertices.length/7;vertices=null;
const starProgram=program(`#version 300 es
precision highp float;
uniform vec2 resolution;uniform float phase;
out vec2 uv;out float brightness;out float hue;
float hash(float n){return fract(sin(n*127.1)*43758.5453);}
void main(){float id=float(gl_InstanceID);float a=hash(id+1.)*6.2831853;float cycles=7.+floor(hash(id+4.)*7.);float t=fract(hash(id+8.)+phase/6.2831853*cycles);float z=pow(t,3.);vec2 dir=vec2(cos(a),sin(a));dir.x*=resolution.y/resolution.x;vec2 origin=vec2(.03,.29);float radius=.025+z*(2.6+hash(id+13.)*2.);float len=(.015+z*.55)*(.3+hash(id+19.));vec2 head=origin+dir*radius,tail=origin+dir*max(.008,radius-len);vec2 perp=vec2(-dir.y,dir.x);perp=normalize(perp);float width=(.65+hash(id+31.)*.65)/resolution.y;int k=gl_VertexID;vec2 corners[6]=vec2[6](vec2(0,-1),vec2(1,-1),vec2(1,1),vec2(0,-1),vec2(1,1),vec2(0,1));uv=corners[k];vec2 p=mix(tail,head,uv.x)+perp*uv.y*width*3.;brightness=(.2+hash(id+42.)*.8)*smoothstep(0.,.09,t)*(1.-smoothstep(.92,1.,t));hue=hash(id+55.);gl_Position=vec4(p,.999,1);}`,`#version 300 es
precision highp float;
in vec2 uv;in float brightness;in float hue;out vec4 color;
void main(){float core=exp(-uv.y*uv.y*14.);vec3 c=vec3(.72,.84,1.)*core;c+=vec3(.18,.01,.005)*exp(-pow((uv.y-.47)*5.,2.))+vec3(.005,.06,.24)*exp(-pow((uv.y+.47)*5.,2.));float endFade=pow(max(0.,sin(uv.x*3.14159265)),.25);color=vec4(c*brightness*endFade,1.);}`);
const fullscreen=`#version 300 es
precision highp float;
out vec2 uv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);uv=p;gl_Position=vec4(p*2.-1.,0,1);}`;
const blurProgram=program(fullscreen,`#version 300 es
precision highp float;
in vec2 uv;out vec4 color;uniform sampler2D tex;uniform vec2 delta;uniform int extract;
void main(){vec3 sum=vec3(0);for(int i=-8;i<=8;i++){vec3 c=texture(tex,uv+float(i)*delta).rgb;if(extract==1)c=max(c-vec3(.52),vec3(0));float w=exp(-float(i*i)/20.);sum+=c*w;}color=vec4(sum/7.887,1);}`);
const composite=program(fullscreen,`#version 300 es
precision highp float;
in vec2 uv;out vec4 color;uniform sampler2D scene;uniform sampler2D bloom;
void main(){vec3 c=texture(scene,uv).rgb+texture(bloom,uv).rgb*1.45;color=vec4(pow(c,vec3(.9)),1.);}`);
const emptyVAO=gl.createVertexArray();let targets=[],width=0,height=0;
function target(w,h,depth){const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texture,0);let d=null;if(depth){d=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,d);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,d)}if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw Error('Incomplete framebuffer');return {f,texture,d,w,h}}
function resize(){const w=params.has('w')?Number(params.get('w')):Math.round(innerWidth*devicePixelRatio),h=params.has('h')?Number(params.get('h')):Math.round(innerHeight*devicePixelRatio);if(!(w>0&&h>0&&Number.isInteger(w)&&Number.isInteger(h)))throw Error('Canvas dimensions must be positive integers');if(w===width&&h===height)return;width=w;height=h;canvas.width=w;canvas.height=h;for(const t of targets){gl.deleteFramebuffer(t.f);gl.deleteTexture(t.texture);if(t.d)gl.deleteRenderbuffer(t.d)}targets=[target(w,h,true),target(Math.ceil(w/4),Math.ceil(h/4),false),target(Math.ceil(w/4),Math.ceil(h/4),false)]}
function normalize(v){let l=Math.hypot(...v);return v.map(x=>x/l)}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0)}
const eye=[6.2,8.2,15.5],look=[0,.0,-.9];
function matrix(){let z=normalize(eye.map((v,i)=>v-look[i])),x=normalize(cross([0,1,0],z)),y=cross(z,x);let view=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1];let f=1/Math.tan(.47/2),aspect=width/height;let projection=[f/aspect,0,0,0,0,f,0,0,0,0,-1.002,-1,0,0,-.2002,0];let out=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)out[c*4+r]+=projection[k*4+r]*view[c*4+k];return out}
function uniform(p,n){return gl.getUniformLocation(p,n)}function bindTexture(unit,t){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t)}function bindTarget(t){gl.bindFramebuffer(gl.FRAMEBUFFER,t?t.f:null);gl.viewport(0,0,t?t.w:width,t?t.h:height)}
window.renderFrame=function(t){try{if(!Number.isFinite(t))throw Error('Time must be finite');resize();let phase=((t%12)+12)%12/12*TAU;bindTarget(targets[0]);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.disable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.bindVertexArray(emptyVAO);gl.useProgram(starProgram);gl.uniform2f(uniform(starProgram,'resolution'),width,height);gl.uniform1f(uniform(starProgram,'phase'),phase);gl.drawArraysInstanced(gl.TRIANGLES,0,6,1000);gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);gl.useProgram(shipProgram);gl.uniformMatrix4fv(uniform(shipProgram,'vp'),false,matrix());gl.uniform3fv(uniform(shipProgram,'eye'),eye);gl.uniform1f(uniform(shipProgram,'phase'),phase);gl.bindVertexArray(shipVAO);gl.drawArrays(gl.TRIANGLES,0,shipCount);gl.disable(gl.DEPTH_TEST);gl.bindVertexArray(emptyVAO);gl.useProgram(blurProgram);gl.uniform1i(uniform(blurProgram,'tex'),0);bindTarget(targets[1]);bindTexture(0,targets[0].texture);gl.uniform2f(uniform(blurProgram,'delta'),1/targets[1].w,0);gl.uniform1i(uniform(blurProgram,'extract'),1);gl.drawArrays(gl.TRIANGLES,0,3);bindTarget(targets[2]);bindTexture(0,targets[1].texture);gl.uniform2f(uniform(blurProgram,'delta'),0,1/targets[2].h);gl.uniform1i(uniform(blurProgram,'extract'),0);gl.drawArrays(gl.TRIANGLES,0,3);bindTarget(null);gl.useProgram(composite);bindTexture(0,targets[0].texture);bindTexture(1,targets[2].texture);gl.uniform1i(uniform(composite,'scene'),0);gl.uniform1i(uniform(composite,'bloom'),1);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();}catch(e){fail(e);throw e}};

}catch(e){fail(e)}
